name: Nexus Mods

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Update the mod version
      run: |
        MOD_VERSION="${VERSION#v}"

        for DESCRIPTOR in "ui-prescripted-countries.mod" "ui-prescripted-countries/descriptor.mod"
        do
          if grep -q '^version=' "${DESCRIPTOR}"; then
            sed -i "s/^version=.*/version=\"${MOD_VERSION}\"/" "${DESCRIPTOR}"
          else
            printf 'version="%s"\n' "${MOD_VERSION}" | cat - "${DESCRIPTOR}" > "${DESCRIPTOR}.tmp"
            mv "${DESCRIPTOR}.tmp" "${DESCRIPTOR}"
          fi
        done

    - name: Build the release archive
      run: |
        zip -r "release.zip" "ui-prescripted-countries/" "ui-prescripted-countries.mod"

    - name: Upload
      uses: Nexus-Mods/upload-action@v1.0.0-beta.11
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 948787
        filename: release.zip
        display_name: ui-prescripted-countries.zip
        version: ${{env.VERSION}}
        description: "Changelog: https://github.com/hmlendea/stellaris-ui-prescripted-countries/releases/${{env.VERSION}}"
        category: main
        archive_existing_version: true
        update_mod_version: true